[package]
name = "fdt_vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testing = []

[dependencies]
serde_json = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
fdt_analysis = { path = "../fdt_analysis" }
fdt_vm = { path = ".", features = ["testing"] }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Run the example's unit tests (its percentile helper) with `cargo test`.
[[example]]
name = "frame_build_sampler"
test = true
