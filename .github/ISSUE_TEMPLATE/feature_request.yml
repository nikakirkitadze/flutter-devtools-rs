name: Idea or feature request
description: Something fdt should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem you hit while debugging your app. What would you have liked fdt to show or let you do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In Flutter DevTools, another tool, or by hand.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you picture it working, if you have one in mind.
