[workspace]
resolver = "3"
members = ["crates/fdt_ui", "crates/fdt_app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui_kit = { package = "gpui-kit", version = "=0.10.0", features = ["profiler"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "6"
regex = "1"
tempfile = "3"
criterion = "0.8"

[profile.release]
debug = "line-tables-only"
